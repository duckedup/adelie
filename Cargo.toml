[package]
name = "adelie"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "A pure-Rust columnar analytics store with SQL."
repository = "https://github.com/duckedup/adelie"
license = "MIT"
exclude = [".agents/", ".beads/", ".claude/", ".codex/", ".cursor/", ".github/", "AGENTS.md", "decisions/", "justfile", "scripts/", "harness/", "bench/", "tests/"]

# harness/ is the zero-dependency test harness (a dev-dependency, never published). bench/ is
# its own workspace so DuckDB never enters this lockfile or the build budget (D0006).
[workspace]
members = ["harness"]
exclude = ["bench"]

[lib]
name = "adelie"
path = "src/lib.rs"

# The `adelie` binary. Gated behind `cli`, which the default feature set enables, so
# `cargo install adelie` builds it and `cargo binstall adelie` fetches a prebuilt one.
# `--no-default-features` is the lean library build and refuses to build the binary.
[[bin]]
name = "adelie"
path = "src/bin/adelie.rs"
required-features = ["cli"]

[features]
# The default build ships the whole binary. `--no-default-features` is the lean library
# build that `just test`/`just ci` run and CI's build budget times clean (D0004).
default = ["cli"]
cli = []

[dependencies]

[dev-dependencies]
adelie-harness = { path = "harness" }

# Prebuilt-binary fetch for `cargo binstall adelie`. Release assets are
# `adelie-<target>.tar.gz` (`.zip` on Windows), each holding the bare `adelie` binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/adelie-{ target }{ archive-suffix }"
bin-dir = "adelie{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = "thin"
codegen-units = 1
