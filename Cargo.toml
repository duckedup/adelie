[package]
name = "adelie"
version = "0.11.0"
edition = "2024"
rust-version = "1.98"
description = "A pure-Rust columnar analytics store with SQL."
repository = "https://github.com/duckedup/adelie"
license = "MIT"
exclude = [".agents/", ".beads/", ".claude/", ".codex/", ".cursor/", ".github/", "AGENTS.md", "decisions/", "justfile", "scripts/", "harness/", "bench/", "tests/"]

# harness/ is the zero-dependency test harness (a dev-dependency, never published). bench/ is
# its own workspace so DuckDB never enters this lockfile or the build budget (D0006).
[workspace]
members = ["harness"]
exclude = ["bench"]

[lib]
name = "adelie"
path = "src/lib.rs"

# The `adelie` binary. Gated behind `cli`, which the default feature set enables, so
# `cargo install adelie` builds it and `cargo binstall adelie` fetches a prebuilt one.
# `--no-default-features` is the lean library build and refuses to build the binary.
[[bin]]
name = "adelie"
path = "src/bin/adelie.rs"
required-features = ["cli"]

[features]
# The default build ships the CLI, the MCP server and the HTTP server. `--no-default-features`
# is the lean, dependency-free library build that `just test`/`just ci` run and CI's build
# budget times clean (D0004). The default build has its own 120s budget.
default = ["cli", "mcp", "serve"]
cli = ["dep:clap", "dep:csv", "dep:comfy-table", "dep:serde", "dep:serde_json"]
mcp = ["cli", "dep:rmcp", "dep:tokio"]
serve = ["mcp", "dep:axum", "dep:tokio"]

# Widely used crates for everything that is not the core problem. All optional: the lean
# build has no dependencies.
[dependencies]
clap = { version = "4", optional = true, default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
csv = { version = "1", optional = true }
comfy-table = { version = "8", optional = true, default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", optional = true }
rmcp = { version = "3", optional = true, default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros", "signal"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "json"] }

[dev-dependencies]
adelie-harness = { path = "harness" }

# Prebuilt-binary fetch for `cargo binstall adelie`. Release assets are
# `adelie-<target>.tar.gz` (`.zip` on Windows), each holding the bare `adelie` binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/adelie-{ target }{ archive-suffix }"
bin-dir = "adelie{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = "thin"
codegen-units = 1
