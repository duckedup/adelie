name: CI

# merge_group is not optional once a merge queue is on: a queued PR builds on a temporary
# gh-readonly-queue ref, and a required check that does not run there never reports (D0003).
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds clean each run; incremental artifacts only bloat the cache.
  CARGO_INCREMENTAL: "0"

# The toolchain is pinned by rust-toolchain.toml; `dtolnay/rust-toolchain@stable` only
# bootstraps rustup, and the pin wins. Miri alone runs on nightly.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The build budget (D0004): a clean, uncached, offline build of the lean library build.
  # Deps are fetched first so network time is not counted. The 60s bound is order-of-
  # magnitude on purpose: loose enough for a shared runner, tight enough that a bundled-C
  # tree cannot pass.
  build-budget:
    name: build-budget (clean-build timer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies (network time is not compile time)
        run: cargo fetch
      - name: Time a clean offline build of the lean library build
        run: |
          start=$(date +%s)
          cargo build --offline --no-default-features
          elapsed=$(( $(date +%s) - start ))
          echo "clean build: ${elapsed}s (budget: 60s, D0004)"
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::clean build took ${elapsed}s, over the 60s budget (D0004). A new dependency likely blew the build budget; that is a design change, not an implementation detail."
            exit 1
          fi

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: lean library build (--no-default-features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: default build
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: lean library build (--no-default-features)
        run: cargo test --workspace --no-default-features
      - name: default build
        if: ${{ !cancelled() }}
        run: cargo test --workspace

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - run: cargo build --release --no-default-features

  # Undefined-behaviour check over the lean library build. A test Miri cannot run (fsync,
  # unsupported syscalls) carries `#[cfg_attr(miri, ignore)]` with its reason.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-miri-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-miri-
      - name: Test with Miri
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo miri test --workspace --no-default-features

  # DuckDB differential and benchmark smoke. bench/ is its own workspace (D0006): the bundled
  # C++ build happens only here, never in the root lockfile or the build budget. --release
  # throughout so one profile of DuckDB is built and cached, not two.
  bench:
    name: bench (DuckDB differential)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bench/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('bench/Cargo.lock', 'bench/Cargo.toml', 'harness/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
      - run: cargo fmt -- --check
      - run: cargo test --release --locked
      - name: Differential over the sqllogictest corpus
        run: cargo run --release --locked --bin differential -- ../tests/slt
      - name: Benchmark smoke (every query executes)
        run: cargo run --release --locked --bin bench -- smoke

  # The skill's detectors: pure fixtures, no repo state, no network. Nothing else runs them,
  # so without this a PR could delete a case and go green.
  checker-selftest:
    name: adelie-check selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: .claude/skills/adelie/bin/adelie-check selftest

  # The laws against the PR's own diff. Not `--strict`: errors fail, warnings (stale-ticket
  # fires on every referenced open bead) do not. A merge group has no PR number, hence two
  # modes; push is skipped, main's history is not a diff.
  checker-laws:
    name: adelie-check laws
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      # Full history: the laws need a merge base.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # `--pr` reads the real base ref and the PR body. A merge group diffs against its
      # base_sha: the commit this entry builds on, which for a stacked or queued entry is the
      # entry ahead of it, not main. Diffing against main would hold it to every PR below it.
      - name: Check repo laws
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            .claude/skills/adelie/bin/adelie-check laws --pr ${{ github.event.pull_request.number }}
          else
            .claude/skills/adelie/bin/adelie-check laws --base "$BASE_SHA"
          fi
