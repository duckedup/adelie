name: Release

# A release fires on push to main when Cargo.toml's version has no `v<version>` tag yet, so
# a PR that does not bump the version ships nothing. 0.0.0 never releases: it is the
# pre-release placeholder.
on:
  push:
    branches: [main]

# Serialized: a merge train pushes several bump commits minutes apart, and concurrent runs
# race the tag check (found in nidus, #124).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tag + GitHub release

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check for version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version should release
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$VERSION" = "0.0.0" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version is the 0.0.0 placeholder, skipping release"
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists, skipping release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION does not exist, will release"
          fi

  publish-crate:
    name: Publish to crates.io
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-publish-
      # Idempotent: a re-run after a later step failed must not fail on "already exists".
      - name: Publish
        run: |
          OUTPUT=$(cargo publish 2>&1) && exit 0
          if echo "$OUTPUT" | grep -q "already exists"; then
            echo "Version already published to crates.io, skipping"
          else
            echo "$OUTPUT"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [check-version, publish-crate]
    if: "!failure() && !cancelled() && needs.check-version.outputs.should_release == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git tag ${{ needs.check-version.outputs.tag }}
          git push origin ${{ needs.check-version.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          # `|| true`: grep -v exits 1 when it filters everything out (the first release).
          PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -v "^${TAG}$" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          fi
          gh release create "$TAG" --title "$TAG" --latest --notes "## adelie ${VERSION}

          \`\`\`sh
          cargo add adelie@${VERSION}
          \`\`\`

          ${NOTES}"
